; PlatformIO project — SMA Variable Voltage Controller
; Board: SMA Variable Voltage Controller (PN 008-300A-0003), Hybrid Dynamic Robotics Lab, U-Michigan
; MCU: Arduino Uno (ATmega328P)
;
; Hardware summary (from doc/Schematic PDF_[No Variations].pdf):
;   MCP4018 digipot wiper -> TPS7A57 LDO REF pin -> sets V_LDO (~0.5..5.2 V).
;   V_LDO -> 0.33 ohm shunt (R1) -> SMA. INA296A1 (gain 10 V/V) senses shunt -> ISNS_OUT.
;   SMA_EN gates low-side MOSFET Q1 to enable SMA current.

[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino

; Serial console baud (keep in sync with SERIAL_BAUD in include/config.h)
monitor_speed = 115200

build_flags =
    -D SERIAL_BAUD=115200

; Wire (I2C) and EEPROM are part of the Arduino core for AVR; no external deps needed.
lib_deps =
