; PlatformIO project - SMA Variable Voltage Controller
; Board: SMA Variable Voltage Controller (PN 008-300A-0003), Hybrid Dynamic Robotics Lab, U-Michigan
;
; Hardware summary (from doc/Schematic PDF_[No Variations].pdf):
;   MCP4018 digipot wiper -> TPS7A57 LDO REF pin -> sets V_LDO (~0.5..5.2 V).
;   V_LDO -> 0.33 ohm shunt (R1) -> SMA. INA296A1 (gain 10 V/V) senses shunt -> ISNS_OUT.
;   SMA_EN gates low-side MOSFET Q1 to enable SMA current.
;
; The bench unit connected over USB is an Arduino Mega 2560, so that is the
; default build/upload target. Switch with:  pio run -e uno   (or -e mega2560)

[platformio]
default_envs = mega2560

[env]
framework = arduino
monitor_speed = 115200
; Echo typed characters in the serial monitor so you can see commands as you type.
monitor_echo = yes
build_flags = -D SERIAL_BAUD=115200

; Arduino Mega 2560 (ATmega2560). I2C: SDA=pin 20, SCL=pin 21.
[env:mega2560]
platform = atmelavr
board = megaatmega2560

; Arduino Uno (ATmega328P). I2C: SDA=A4, SCL=A5.
[env:uno]
platform = atmelavr
board = uno
